<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lost Signal | ORBIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F7F6F1;
    --ink-2:#FFFFFF;
    --ink-3:#EFEDE4;
    --paper:#FFFFFF;
    --paper-2:#EFEDE4;
    --dark:#14172A;
    --violet:#7C5CFC;
    --violet-soft:#a996ff;
    --gold:#F5A623;
    --coral:#FF6B5E;
    --slate:#5B6178;
    --ink-text:#14172A;
    --line:rgba(20,23,42,.10);
    --line-dark:rgba(20,23,42,.1);
    --radius:18px;
    --radius-sm:10px;
    --maxw:1280px;
    --ease:cubic-bezier(.16,.84,.44,1);
    --shadow:0 20px 60px -20px rgba(20,23,42,.15);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink-text);
    height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* ---------- Ambient starfield / grid ---------- */
  .field{
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(20,23,42,.12) 0, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(20,23,42,.10) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(124,92,252,.25) 0, transparent 100%),
      radial-gradient(1px 1px at 30% 85%, rgba(20,23,42,.10) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 60%, rgba(245,166,35,.30) 0, transparent 100%),
      radial-gradient(1px 1px at 45% 40%, rgba(20,23,42,.08) 0, transparent 100%),
      radial-gradient(1px 1px at 15% 55%, rgba(20,23,42,.10) 0, transparent 100%);
    pointer-events:none;
    z-index:0;
  }

  .field::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.5;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 42%, black, transparent 75%);
  }

  /* ---------- Top bar ---------- */
  header{
    position:relative;
    z-index:3;
    max-width:var(--maxw);
    margin:0 auto;
    padding:16px 40px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    letter-spacing:.01em;
    color:var(--ink-text);
    text-decoration:none;
  }

  .brand-mark{
    width:30px;height:30px;
    border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 35% 30%, var(--violet-soft), var(--violet) 60%);
    box-shadow:0 4px 14px -4px rgba(124,92,252,.55);
    flex-shrink:0;
  }
  .brand-mark::after{
    content:'';
    position:absolute;
    inset:-6px;
    border:1.5px solid var(--violet);
    opacity:.35;
    border-radius:50%;
    transform:rotate(-18deg) scaleY(.4);
  }

  .back-link{
    font-size:.85rem;
    font-weight:500;
    color:var(--slate);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:999px;
    transition:border-color .25s var(--ease), color .25s var(--ease), background .25s var(--ease);
  }
  .back-link:hover{
    border-color:var(--violet);
    color:var(--violet);
    background:rgba(124,92,252,.06);
  }
  .back-link svg{width:14px;height:14px;flex-shrink:0;}

  /* ---------- Main stage ---------- */
  main{
    position:relative;
    z-index:2;
    max-width:var(--maxw);
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8px 40px;
    text-align:center;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:min(280px, 34vh, 40vw);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:0;
    flex-shrink:0;
  }

  .orbit-ring{
    position:absolute;
    border:1.5px dashed var(--line-dark);
    border-radius:50%;
    top:50%;left:50%;
    transform-origin:center;
  }
  .orbit-ring.r1{ width:100%; height:100%; margin:-50% 0 0 -50%; border-color:rgba(124,92,252,.22); }
  .orbit-ring.r2{ width:74%; height:74%; margin:-37% 0 0 -37%; border-color:rgba(20,23,42,.10); border-style:solid; border-width:1px; }
  .orbit-ring.r3{ width:52%; height:52%; margin:-26% 0 0 -26%; border-color:rgba(245,166,35,.28); }

  .orbit-ring.broken{
    border-style:dashed;
  }
  .orbit-ring.r1 .gap{ }

  /* the break in the outer ring, drawn as an SVG overlay instead of border trick */
  .orbit-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .planet-404{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:0;
    z-index:2;
  }

  .digit{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2.2rem, 6vh, 3.6rem);
    line-height:1;
    color:var(--ink-text);
    letter-spacing:-0.02em;
  }

  .zero-orb{
    position:relative;
    width:clamp(2.1rem, 5.6vh, 3.4rem);
    height:clamp(2.1rem, 5.6vh, 3.4rem);
    margin:0 .12em;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--violet-soft) 0%, var(--violet) 55%, #5c3fe0 100%);
    box-shadow: inset -10px -10px 24px rgba(20,23,42,.35), 0 24px 50px -18px rgba(124,92,252,.6);
    display:inline-block;
    vertical-align:middle;
  }
  .zero-orb::before{
    content:'';
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:
      radial-gradient(circle at 60% 70%, rgba(20,23,42,.18), transparent 60%),
      radial-gradient(circle at 25% 60%, rgba(20,23,42,.12), transparent 50%);
  }
  .zero-orb::after{
    content:'';
    position:absolute;
    left:50%; top:50%;
    width:150%; height:34%;
    border:1.5px solid var(--gold);
    border-radius:50%;
    transform:translate(-50%,-50%) rotate(-20deg);
    opacity:.85;
  }

  .satellite{
    position:absolute;
    width:16px;height:16px;
    z-index:3;
  }
  .satellite svg{ width:100%; height:100%; display:block; }

  .kicker{
    margin-top:2px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--coral);
  }
  .kicker::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--coral);
    box-shadow:0 0 0 4px rgba(255,107,94,.18);
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(1.15rem, 2.4vh, 1.7rem);
    letter-spacing:-0.01em;
    color:var(--ink-text);
    margin-top:6px;
  }

  p.lede{
    max-width:440px;
    margin:8px auto 0;
    color:var(--slate);
    font-size:.88rem;
    line-height:1.5;
  }

  .actions{
    margin-top:16px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.85rem;
    padding:10px 20px;
    border-radius:999px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease), border-color .3s var(--ease);
    border:1px solid transparent;
  }
  .btn svg{width:14px;height:14px;flex-shrink:0;}

  button.btn{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
  }

  .btn-primary{
    background:var(--dark);
    color:var(--ink);
    box-shadow:0 16px 30px -14px rgba(20,23,42,.45);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 36px -14px rgba(20,23,42,.5);
    background:#1d2140;
  }

  .btn-ghost{
    background:transparent;
    color:var(--ink-text);
    border-color:var(--line);
  }
  .btn-ghost:hover{
    border-color:var(--violet);
    color:var(--violet);
    background:rgba(124,92,252,.06);
    transform:translateY(-2px);
  }

  .coords{
    margin-top:18px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    font-size:.7rem;
    color:var(--slate);
    letter-spacing:.04em;
  }
  .coords span{ font-weight:600; color:var(--ink-text); }
  .coords .divider{ opacity:.35; }

  @media (max-width:640px){
    header{ padding:12px 20px 0; }
    main{ padding:6px 20px; }
    .coords{ gap:10px 16px; }
    .actions{ flex-direction:column; width:100%; max-width:260px; }
    .btn{ justify-content:center; width:100%; }
  }

  @media (max-height:700px){
    .stage{ width:min(220px, 28vh, 34vw); }
    .digit{ font-size:clamp(1.8rem, 5vh, 2.8rem); }
    .zero-orb{ width:clamp(1.7rem, 4.6vh, 2.6rem); height:clamp(1.7rem, 4.6vh, 2.6rem); }
    h1{ font-size:clamp(1rem, 2vh, 1.4rem); }
    p.lede{ font-size:.82rem; }
  }

  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="field" aria-hidden="true"></div>

<!-- <header>
  <a href="index.html" class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    Sta
  </a>
  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>
</header> -->

<main>
  <div class="stage" id="stage">
    <div class="orbit-ring r1" id="ring1"></div>
    <div class="orbit-ring r2" id="ring2"></div>
    <div class="orbit-ring r3" id="ring3"></div>

    <svg class="orbit-svg" viewBox="0 0 100 100" aria-hidden="true">
      <!-- dashed path the satellite has drifted off -->
      <path id="driftPath" d="M 50 2 A 48 48 0 1 1 8 26" fill="none" stroke="rgba(255,107,94,.5)" stroke-width="0.6" stroke-dasharray="2 3"/>
    </svg>

    <div class="satellite" id="satellite" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" fill="#FF6B5E"/>
        <path d="M3 8l3 3-3 3M21 8l-3 3 3 3" stroke="#FF6B5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 4l1.5 4M16 4l-1.5 4M8 20l1.5-4M16 20l-1.5-4" stroke="#FF6B5E" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="planet-404" id="planet">
      <span class="digit">4</span>
      <span class="zero-orb" id="orb"></span>
      <span class="digit">4</span>
    </div>
  </div>

  <p class="kicker">Signal lost</p>
  <h1>This page has drifted out of stackly.</h1>
  <p class="lede">
    The lesson, course, or page you're looking for doesn't exist anymore — or it never did.
    Let's get you back on a stable trajectory.
  </p>

  <div class="actions">
    <button type="button" class="btn btn-ghost" id="goBackBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Go back
    </button>
    <a href="index.html" class="btn btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4a1 1 0 001-1v-4h2v4a1 1 0 001 1h4a1 1 0 001-1V10"/></svg>
      Return to home
    </a>
    <!-- <a href="courses.html" class="btn btn-ghost">
      Browse courses
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a> -->
  </div>

  <div class="coords">
    <span>ERR 404</span>
    <span class="divider">·</span>
    <span>STACKLY-CLASS: unresolved</span>
    <span class="divider">·</span>
    <span>STATUS: recalibrating</span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // gentle continuous rotation of the orbital rings, each at a different speed/direction
  gsap.to("#ring1", { rotate: 360, duration: 90, repeat: -1, ease: "none" });
  gsap.to("#ring2", { rotate: -360, duration: 60, repeat: -1, ease: "none" });
  gsap.to("#ring3", { rotate: 360, duration: 40, repeat: -1, ease: "none" });

  // satellite drifting along the broken dashed path, then looping back
  const path = document.getElementById("driftPath");
  const satellite = document.getElementById("satellite");
  const pathLength = path.getTotalLength();

  function positionSatellite(progress){
    const point = path.getPointAtLength(progress * pathLength);
    // map svg viewBox (0-100) coords to the stage's actual pixel box
    const stage = document.getElementById("stage");
    const rect = stage.getBoundingClientRect();
    const x = (point.x / 100) * rect.width;
    const y = (point.y / 100) * rect.height;
    satellite.style.transform = `translate(${x - 8}px, ${y - 8}px)`;
  }

  let driftProgress = { v: 0 };
  gsap.to(driftProgress, {
    v: 1,
    duration: 7,
    repeat: -1,
    ease: "power1.inOut",
    onUpdate: () => positionSatellite(driftProgress.v)
  });
  window.addEventListener("resize", () => positionSatellite(driftProgress.v));
  positionSatellite(0);

  // planet 404 gentle float + entrance
  gsap.from("#planet", { y: 24, opacity: 0, duration: 1, ease: "power3.out" });
  gsap.to("#planet", { y: -8, duration: 3.2, repeat: -1, yoyo: true, ease: "sine.inOut", delay: 1 });

  // the violet "0" orb spins slowly on its own axis (ring tilt shimmer)
  gsap.to("#orb", { rotate: 360, duration: 22, repeat: -1, ease: "none", transformOrigin: "50% 50%" });

  // go back to the previous page if history exists, otherwise fall back to home
  document.getElementById("goBackBtn").addEventListener("click", () => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "index.html";
    }
  });

  // staggered fade-in for supporting content
  gsap.from([".kicker", "h1", ".lede", ".actions", ".coords"], {
    y: 18, opacity: 0, duration: .8, stagger: .12, ease: "power3.out", delay: .3
  });
</script>

</body>
</html>
